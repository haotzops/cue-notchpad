name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify release metadata
        shell: bash
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Supporting/Info.plist)
          [[ "$plist_version" == "$RELEASE_VERSION" ]]
          [[ -f "Docs/releases/v$RELEASE_VERSION.md" ]]

      - name: Run checks and build release assets once
        run: RELEASE_VERSION="$RELEASE_VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" make release-preflight

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Cue-Notchpad-${{ env.RELEASE_VERSION }}-macOS-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/PROVENANCE.json
          if-no-files-found: error

      - name: Create and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive_name="Cue-Notchpad-$RELEASE_VERSION-macOS-arm64.zip"
          archive="dist/$archive_name"
          local_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"

          gh release create "$GITHUB_REF_NAME" \
            "$archive" dist/SHA256SUMS dist/PROVENANCE.json \
            --draft \
            --title "Cue Notchpad $GITHUB_REF_NAME" \
            --notes-file "Docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag

          release_id=""
          for _ in $(seq 1 12); do
            release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId,isDraft \
              --jq 'select(.isDraft == true) | .databaseId' 2>/dev/null || true)"
            [[ "$release_id" =~ ^[0-9]+$ ]] && break
            sleep 2
          done
          [[ "$release_id" =~ ^[0-9]+$ ]] || {
            echo "Unable to identify the draft release for $GITHUB_REF_NAME." >&2
            exit 1
          }
          github_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq ".[] | select(.name == \"$archive_name\") | .digest")"
          [[ "$github_digest" == "sha256:$local_sha256" ]] || {
            printf 'Release asset digest mismatch: local=sha256:%s GitHub=%s\n' \
              "$local_sha256" "$github_digest" >&2
            exit 1
          }

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq '.isImmutable')" == "true" ]] || {
            echo 'The release was published, but immutable releases are not enabled for this repository.' >&2
            exit 1
          }
