name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing (for example, 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify release metadata
        shell: bash
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Supporting/Info.plist)
          [[ "$plist_version" == "$RELEASE_VERSION" ]]
          [[ -f "Docs/releases/v$RELEASE_VERSION.md" ]]

      - name: Test
        run: make test

      - name: Build release assets
        run: RELEASE_VERSION="$RELEASE_VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./Scripts/build-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cue-Notchpad-${{ env.RELEASE_VERSION }}-macOS-universal
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/SHA256SUMS \
            --title "Cue Notchpad $GITHUB_REF_NAME" \
            --notes-file "Docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag
